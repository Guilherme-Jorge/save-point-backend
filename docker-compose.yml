name: save_point_backend
services:
  app:
    container_name: save_point_nestjs_app
    build:
      context: .
      dockerfile: Dockerfile
    # restart: always
    ports:
      - 3000:3000
    networks:
      - save_point_postgres_net
    depends_on:
      - db
      - cover-matcher

  db:
    container_name: save_point_postgres_db
    image: postgres:17.4-alpine
    # restart: always
    env_file:
      - ./.env
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - save_point_postgres_net

  cover-matcher:
    container_name: save_point_cover_matcher
    build:
      context: .
      dockerfile: services/cover-matcher/Dockerfile
    environment:
      - COVERS_ROOT=/data
      - DEVICE=cpu
      - INDEX_PATH=/data/covers/covers.faiss
      - META_PATH=/data/covers/covers_meta.json
      - WEIGHTS_PATH=/data/covers/cover_encoder.pt
    volumes:
      - ./data:/data:ro
    ports:
      - 8000:8000
    networks:
      - save_point_postgres_net

volumes:
  postgres_data:

networks:
  save_point_postgres_net:
    driver: bridge
